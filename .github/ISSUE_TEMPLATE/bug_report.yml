name: Bug report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels:
  - bug
assignees: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: screenshots_logs
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots and/or relevant logs.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide details about your environment.
      placeholder: |
        OS: Windows 11
        App version / commit: v1.2.0 or commit hash
        Build/Run method: local run, CI build, release binary
    validations:
      required: true

  - type: checkboxes
    id: frequency
    attributes:
      label: Frequency
      options:
        - label: Always reproducible
        - label: Intermittent
        - label: Happened once

  - type: checkboxes
    id: severity_impact
    attributes:
      label: Severity / Impact
      options:
        - label: Blocks use of the app
        - label: Major feature broken
        - label: Minor issue / workaround exists
        - label: Cosmetic

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
