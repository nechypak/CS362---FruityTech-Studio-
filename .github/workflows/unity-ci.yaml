name: FruityTech CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test FruityTech 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: src/FruityTech-Studio/Library
          key: Library-${{ hashFiles('src/FruityTech-Studio/Assets/**', 'src/FruityTech-Studio/Packages/**', 'src/FruityTech-Studio/ProjectSettings/**') }}
          restore-keys: Library-

      - name: Validate Unity license input
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.UNITY_LICENSE }}" && ( -z "${{ secrets.UNITY_EMAIL }}" || -z "${{ secrets.UNITY_PASSWORD }}" ) ]]; then
            echo "Missing Unity licensing secrets. Provide UNITY_LICENSE, or UNITY_EMAIL + UNITY_PASSWORD."
            exit 1
          fi

      - name: Prepare Unity writable directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-home/.local/share/unity3d
          mkdir -p .ci-home/.cache/unity3d
          mkdir -p .ci-home/.config/unity3d

      - name: Patch GameCI script BOM
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_WORKSPACE%/*}/_actions"
          TARGET="$(find "$ROOT" -path "*/game-ci/unity-test-runner/*/dist/platforms/ubuntu/set_gitcredential.sh" -print -quit)"
          echo "Patching: $TARGET"
          # Remove UTF-8 BOM if present
          sed -i '1s/^\xEF\xBB\xBF//' "$TARGET"
          head -n 1 "$TARGET"
          

      - name: Run Tests
        uses: game-ci/unity-test-runner@v4
        env:
          HOME: /github/workspace/.ci-home
          XDG_CONFIG_HOME: /github/workspace/.ci-home/.config
          XDG_CACHE_HOME: /github/workspace/.ci-home/.cache
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.6f1
          projectPath: "src/FruityTech-Studio"
          testMode: all

        
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: artifacts

  build:
    name: Build project
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: "src/FruityTech-Studio/Library"
          key: Library-${{ hashFiles('src/FruityTech-Studio/Assets/**', 'src/FruityTech-Studio/Packages/**', 'src/FruityTech-Studio/ProjectSettings/**') }}
          restore-keys: Library-

      - name: Validate Unity license input
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ secrets.UNITY_LICENSE }}" && ( -z "${{ secrets.UNITY_EMAIL }}" || -z "${{ secrets.UNITY_PASSWORD }}" ) ]]; then
            echo "Missing Unity licensing secrets. Provide UNITY_LICENSE, or UNITY_EMAIL + UNITY_PASSWORD."
            exit 1
          fi

      - name: Prepare Unity writable directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-home/.local/share/unity3d
          mkdir -p .ci-home/.cache/unity3d
          mkdir -p .ci-home/.config/unity3d

      - name: Patch GameCI script BOM
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${RUNNER_WORKSPACE%/*}/_actions"
      
          patch_one () {
            local action="$1"
            local target
            target="$(find "$ROOT" -path "*/game-ci/${action}/*/dist/platforms/ubuntu/set_gitcredential.sh" -print -quit || true)"
            if [[ -n "${target:-}" ]]; then
              echo "Patching: $target"
              sed -i '1s/^\xEF\xBB\xBF//' "$target"
              head -n 1 "$target"
            else
              echo "No set_gitcredential.sh found for ${action} (skipping)"
            fi
          }

          patch_one "unity-builder"
          patch_one "unity-test-runner"

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          HOME: /github/workspace/.ci-home
          XDG_CONFIG_HOME: /github/workspace/.ci-home/.config
          XDG_CACHE_HOME: /github/workspace/.ci-home/.cache
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.6f1
          projectPath: "src/FruityTech-Studio"
          targetPlatform: StandaloneWindows64
          buildName: FruityTech-Studio
          buildsPath: build/FruityTech-Studio
          

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FruityTech-Build
          path: build
