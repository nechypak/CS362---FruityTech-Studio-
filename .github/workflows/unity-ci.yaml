name: FruityTech CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test FruityTech 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: "src/FruityTech Studio/Library"
          key: Library-${{ hashFiles('src/FruityTech Studio/Assets/**', 'src/FruityTech Studio/Packages/**', 'src/FruityTech Studio/ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: unityci/editor:ubuntu-6000.3.6f1-linux-il2cpp
          projectPath: "src/FruityTech Studio"
          testMode: all

        
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: artifacts

  build:
    name: Build project
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: "src/FruityTech Studio/Library"
          key: Library-${{ hashFiles('src/FruityTech Studio/Assets/**', 'src/FruityTech Studio/Packages/**', 'src/FruityTech Studio/ProjectSettings/**') }}
          restore-keys: Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          customImage: unityci/editor:ubuntu-6000.3.6f1-linux-il2cpp
          projectPath: "src/FruityTech Studio"
          targetPlatform: StandaloneWindows64
          

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FruityTech-Build
          path: build
